<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Document</title>
  </head>
  <body>
    <p>Create User</p>

    <form
      action="/user"
      method="post"
    >
      Name:
      <input
        type="text"
        name="firstname"
      /><br />
      Surname:
      <input
        type="text"
        name="lastname"
      /><br />
      Email:
      <input
        type="text"
        name="email"
      /><br />
      <input
        type="submit"
        value="Submit"
      />
    </form>
  </body>
</html>
